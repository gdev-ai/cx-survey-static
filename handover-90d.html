  <script>

    /* =====================================================================
       HANDOVER SURVEY · 90 DAYS AFTER HANDOVER  ("Unit Defects & Resolution Follow-up")
       ---------------------------------------------------------------------
       Sent automatically 90 days after the handover date in CRM.
       Questions: D7 and D8 (+ D8_detail when D8 = Yes) for each unit.
       The 7-day survey is a separate page: handover-7d.html.
       Link format (built per customer, e.g. by Marketing Cloud AMPscript):
         handover-90d.html?cid=<Salesforce AccountId>&name=<FirstName>
                          &u=<Unit name>|<Playa|Seashell>  (one u per handed-over unit)
         The CX-2026 form u=<Unit name>|handed|<community> is accepted too.
         community is optional here: it is only shown next to the unit name.
       Example:
         ?cid=0015g00000AbCdE&name=Ahmed&u=Villa%20B12-03|Playa
       Preview: ?demo=1 shows a sample unit; ?state=success|invalid shows that screen.

       Payload (POST JSON to CONFIG.submitUrl, one ref per customer, latest payload per ref wins):
         { survey: "CX-HANDOVER-90D", questionSet, lang, ref: "HO90-XXXXXX",
           status: "partial" | "complete", customerId, demo, linkIssues, submittedAt,
           customer: {},
           units: [{ unit, community, answers: { D7, D8, D8_detail } }] }
         Keys and value types match CX-2026 Part D (index-v2.html): D7 is 1–5, D8 is "Yes" / "No",
         D8_detail is required text when D8 = "Yes" (should open a ticket for the Operation Team).
         With several units, a "partial" goes out (in the background) on each move to the next unit;
         "complete" goes out on Submit. Sends are queued, so a partial never arrives after the complete.
       ===================================================================== */
    const CONFIG = {
      submitUrl: "",               // POST endpoint for the JSON payload. Empty = simulated success.
      demoParam: "demo"            // ?demo=1 shows a sample unit. Any other link must carry a valid cid and u.
    };
    const QUESTION_SET = "2026-11-04";

    /* ===================== QUESTION BANK (Automated survey.docx, 4 Nov 2026) =====================
       Wording and keys are the same as Part D / A1 in index-v2.html. */
    const SAT = { en: ["Very dissatisfied", "Very satisfied"], ar: ["غير راضٍ على الإطلاق", "راضٍ جدًا"] };
    const NA_LABEL = { en: "Not applicable", ar: "لا ينطبق" };

    const Q = {
      D7: {
        type: "rating", en: "How satisfied were you with the support and follow-up provided after your unit handover?",
        ar: "ما مدى رضاك عن الدعم والمتابعة المقدمة لك بعد استلام وحدتك؟"
      },
      D8: {
        type: "yesno", en: "Are there any outstanding issues from your unit handover that you would like us to follow up on?",
        ar: "هل توجد أي ملاحظات تتعلق باستلام وحدتك، وترغب في أن نتابعها معك؟",
        follow: { when: "Yes", key: "D8_detail", label: "Please describe it briefly.", required: true }
      },
    };

    /* unitPage is asked once per unit in the link; customerPage (if any) once per customer. */
    const W = {
      id: "90d", minutes: 1,
      title: { en: "Unit Defects & Resolution Follow-up", ar: "متابعة ملاحظات وحدتك ومعالجتها" },
      intro: {
        en: "We would like to follow up on your unit handover experience and ensure that any reported defects have been addressed.",
        ar: "نود متابعة تجربتك بعد استلام وحدتك والتأكد من معالجة أي ملاحظات أو عيوب تم الإبلاغ عنها."
      },
      unitPage: { title: { en: "After your handover", ar: "بعد استلام وحدتك" }, qs: ["D7", "D8"] }
    };

    /* ===================== ARABIC UI TEXT ===================== */
    const OPT_AR = { "Yes": "نعم", "No": "لا" };
    const UI_AR = { "Please describe it briefly.": "يرجى وصفه باختصار." };
    const COMMUNITY_AR = { Playa: "بلايا", Seashell: "سيشيل" };

    /* ===================== LINK PARSING ===================== */
    const params = new URLSearchParams(location.search);
    const COMMUNITIES = { playa: "Playa", seashell: "Seashell" };
    const HANDED = new Set(["handed", "handed-over"]);

    /* Rules when data is missing or wrong:
         - cid missing or not a Salesforce Account Id       -> "link isn't valid"
         - no u at all, or no usable u                      -> "link isn't valid"
         - one bad u (no name, or a stage other than handed) -> that unit is skipped (linkIssues)
         - community missing or unknown                     -> unit kept, shown without it
         - same unit twice                                  -> shown once
         - name missing, empty, or not just letters . ' -   -> "Dear Valued Homeowner" */
    const CID_RE = /^001[A-Za-z0-9]{12}([A-Za-z0-9]{3})?$/;
    const MAX_UNITS = 60;
    /* Control and bidi marks (Salesforce text often carries U+200F), then collapse whitespace. */
    const clean = s => String(s || "").replace(/[\u0000-\u001F\u007F​-‏‪-‮⁦-⁩﻿]/g, "").replace(/\s+/g, " ").trim();
    const LINK_ISSUES = [];
    const isDemo = params.get(CONFIG.demoParam) === "1";


    function parseUnits() {
      if (isDemo) return "demo";
      const cid = clean(params.get("cid"));
      if (!CID_RE.test(cid)) { LINK_ISSUES.push("cid:" + (cid ? "invalid" : "missing")); return null; }
      const raw = params.getAll("u").map(clean).filter(Boolean);
      if (!raw.length) { LINK_ISSUES.push("u:missing"); return null; }
      const units = [];
      const seen = new Set();
      for (const r of raw) {
        const parts = r.split("|").map(clean);
        /* <unit>|<community>  or the CX-2026 form <unit>|handed|<community> */
        const [nameRaw, stageRaw, commRaw] = parts.length >= 3 ? parts : [parts[0], "handed", parts[1]];
        const name = (nameRaw || "").slice(0, 60);
        const community = COMMUNITIES[(commRaw || "").toLowerCase()] || null;
        if (!name || !HANDED.has((stageRaw || "").toLowerCase())) { LINK_ISSUES.push("u:skipped:" + r.slice(0, 80)); continue; }
        const key = `${community}|${name}`.toLowerCase();
        if (seen.has(key)) continue;
        if (units.length >= MAX_UNITS) { LINK_ISSUES.push("u:over-limit:" + r.slice(0, 80)); continue; }
        seen.add(key);
        units.push({ name, community, label: community ? `${community} · ${name}` : name });
      }
      return units.length ? units : null;
    }

    const DEMO_UNITS = [{ name: "B12-03", community: "Playa", label: "Playa · B12-03" }];

    let parsed;
    try { parsed = parseUnits(); } catch (e) { console.warn("[Handover survey] link parse failed", e); parsed = null; }
    const UNITS = parsed === "demo" ? DEMO_UNITS : parsed;
    /* Salesforce first names arrive as typed: "abdelkader farid", "MAGDA". Fix the case only when it is all one case. */
    const tidyName = s => (s === s.toLowerCase() || s === s.toUpperCase())
      ? s.toLowerCase().replace(/(^|[\s'-])([a-z])/g, (m, p, c) => p + c.toUpperCase()) : s;
    const nameRaw = clean(params.get("name")).slice(0, 40);
    const CUSTOMER = { id: isDemo ? "" : clean(params.get("cid")), name: /^[\p{L}\p{M}][\p{L}\p{M} .'-]*$/u.test(nameRaw) ? tidyName(nameRaw) : "" };

    /* ===================== STEP PLAN ===================== */
    const answers = { customer: {}, units: [] };
    let REF = null;

    function buildSteps() {
      const s = [{ kind: "intro", theme: "gd" }];
      UNITS.forEach((u, i) => {
        answers.units[i] = {};
        s.push({
          kind: "q", theme: "gd", scope: "unit", unit: i, part: W.title, title: W.unitPage.title,
          qs: W.unitPage.qs, pos: i + 1, count: UNITS.length
        });
      });
      if (W.customerPage) s.push({ kind: "q", theme: "gd", scope: "customer", ...W.customerPage });
      return s;
    }
    /* Questions are numbered 1, 2, 3 ... in the order this wave asks them (the keys stay D1, A1 ...). */
    const NUM = {};
    if (W) [...W.unitPage.qs, ...(W.customerPage ? W.customerPage.qs : [])].forEach((id, k) => { NUM[id] = k + 1; });

    /* ===================== RENDER HELPERS ===================== */
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    /* ===================== LANGUAGE =====================
       One language at a time. Default: Arabic when the browser's first language is Arabic,
       otherwise English. The choice made with the header switch is remembered on the device
       (same key as the CX-2026 survey). Switching re-renders the current view; answers are kept. */
    const LANG_KEY = "cx26-lang";
    let LANG = (() => {
      try { const v = localStorage.getItem(LANG_KEY); if (v === "en" || v === "ar") return v; } catch (e) { }
      const first = (navigator.languages && navigator.languages[0]) || navigator.language || "";
      return /^ar\b/i.test(first) ? "ar" : "en";
    })();
    const isAr = () => LANG === "ar";
    /* The active language's text; falls back to English when there is no Arabic. */
    const L = (en, ar) => isAr() && ar ? ar : en;
    const T = o => L(o.en, o.ar);
    const qText = o => isAr() && o.ar ? o.ar : o.en;
    /* Unit names stay as in the contract; the community part is written in Arabic in Arabic. */
    const unitLabel = u => isAr() && u.community ? `${COMMUNITY_AR[u.community] || u.community} · ${u.name}` : u.label;
    /* Arabic noun after a number: 1, 2 (dual), 3–10 (plural), 11+ (singular). */
    const arCount = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : n <= 10 ? few : many;
    let redraw = null;           // re-renders the current view in the new language

    function applyLang() {
      document.documentElement.lang = LANG;
      document.documentElement.dir = isAr() ? "rtl" : "ltr";
      document.title = W ? `${T(W.title)} · G Developments` : "G Developments";
      document.getElementById("progress").setAttribute("aria-label", L("Page progress", "تقدم الصفحة"));
      document.querySelectorAll("#langSwitch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
    }
    document.getElementById("langSwitch").addEventListener("click", e => {
      const b = e.target.closest("button[data-lang]");
      if (!b || b.dataset.lang === LANG) return;
      LANG = b.dataset.lang;
      try { localStorage.setItem(LANG_KEY, LANG); } catch (err) { }
      applyLang();
      // While answers are being sent the view stays as it is; the next view opens in the new language.
      if (redraw && !document.querySelector("#app .spinner")) redraw();
    });
    applyLang();

    const bi = (en, ar) => esc(L(en, ar));
    const btnLabel = (en, ar) => `<span class="btn-label">${esc(L(en, ar))}</span>`;
    const optHtml = o => esc(L(o, OPT_AR[o]));
    let uid = 0;
    const nid = () => "f" + (++uid);

    const bucket = step => step.scope === "unit" ? answers.units[step.unit] : answers.customer;

    function anchorsFor(q) {
      if (q.type === "nps") return { en: ["Not at all likely", "Extremely likely"], ar: ["غير محتمل إطلاقًا", "محتمل جدًا"] };
      return q.anchors || SAT;
    }
    function anchorsHtml(a) {
      return `<div class="anchors"><div>${esc(L(a.en[0], a.ar && a.ar[0]))}</div><div>${esc(L(a.en[1], a.ar && a.ar[1]))}</div></div>`;
    }

    const STAR_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z"/></svg>`;

    /* 1–5 scales render as stars; the NPS 0–10 scale stays numeric. Values submitted are unchanged. */
    function scaleHtml(name, from, to, val, extraClass = "") {
      const stars = extraClass !== "nps";
      let h = `<div class="scale ${stars ? "stars" : ""} ${extraClass}">`;
      for (let n = from; n <= to; n++) {
        const of = `${n} ${L("of", "من")} ${to}`;
        const face = stars ? `${STAR_SVG}<span class="star-num" aria-hidden="true">${n}</span><span class="sr-only">${of}</span>` : n;
        h += `<label${stars ? ` title="${of}"` : ""}><input type="radio" name="${name}" value="${n}" ${String(val) === String(n) ? "checked" : ""}><span class="box">${face}</span></label>`;
      }
      return h + "</div>";
    }

    const optTag = q => q.optional ? `<span class="opt-tag">${L("Optional", "اختياري")}</span>` : "";
    function labelBlock(id, q) {
      return `<span class="q-head"><span class="q-label"><span class="q-num">${NUM[id] || id}</span>${esc(qText(q))}${optTag(q)}</span></span>`;
    }

    function renderQuestion(id, step) {
      const q = Q[id], a = bucket(step), name = id;
      let body = "";

      if (q.type === "text") {
        const fid = nid();
        return `<div class="q" data-q="${id}">
      <label class="q-label" for="${fid}"><span class="q-num">${NUM[id] || id}</span>${esc(qText(q))}${optTag(q)}</label>
      <div class="q-body"><textarea id="${fid}" name="${name}" maxlength="2000">${esc(a[id] || "")}</textarea></div>
      <div class="q-error" role="alert">${L("Please answer this question.", "يرجى الإجابة على هذا السؤال.")}</div></div>`;
      }
      if (q.type === "nps") {
        body = scaleHtml(name, 0, 10, a[id], "nps") + anchorsHtml(anchorsFor(q));
      } else if (q.type === "rating") {
        body = scaleHtml(name, 1, 5, a[id]) + anchorsHtml(anchorsFor(q));
        if (q.na) body += `<div class="na-row"><label><input type="radio" name="${name}" value="N/A" ${a[id] === "N/A" ? "checked" : ""}><span class="box">${esc(qText(q.naLabel || NA_LABEL))}</span></label></div>`;
      } else if (q.type === "yesno") {
        body = `<div class="choices yesno">` + ["Yes", "No"].map(o =>
          `<label><input type="radio" name="${name}" value="${esc(o)}" ${a[id] === o ? "checked" : ""}><span class="box">${optHtml(o)}</span></label>`).join("") + "</div>";
      }

      let follow = "";
      if (q.follow) {
        const fid = nid();
        const show = a[id] === q.follow.when;
        follow = `<div class="follow" data-follow="${q.follow.key}" ${show ? "" : "hidden"}>
      <label for="${fid}">${bi(q.follow.label, UI_AR[q.follow.label])}${q.follow.required ? "" : ` <span class="opt-tag">${L("Optional", "اختياري")}</span>`}</label>
      <textarea id="${fid}" name="${q.follow.key}" maxlength="1000">${esc(a[q.follow.key] || "")}</textarea>
    </div>`;
      }

      return `<div class="q" data-q="${id}"><fieldset>
    <legend>${labelBlock(id, q)}</legend>
    <div class="q-body">${body}${follow}</div>
    <div class="q-error" role="alert">${L("Please answer this question.", "يرجى الإجابة على هذا السؤال.")}</div>
  </fieldset></div>`;
    }

    /* ===================== READ / VALIDATE ===================== */
    function readStep(step) {
      const a = bucket(step);
      const form = document.getElementById("stepForm");
      if (!form) return;
      for (const id of step.qs) {
        const q = Q[id];
        if (q.type === "text") {
          a[id] = form.querySelector(`[name="${id}"]`).value.trim();
        } else {
          const el = form.querySelector(`input[name="${id}"]:checked`);
          if (el) a[id] = (q.type === "nps" || q.type === "rating") && el.value !== "N/A" ? Number(el.value) : el.value;
        }
        if (q.follow) {
          const f = form.querySelector(`[name="${q.follow.key}"]`);
          if (a[id] === q.follow.when && f) a[q.follow.key] = f.value.trim(); else delete a[q.follow.key];
        }
      }
    }

    function validateStep(step) {
      const a = bucket(step);
      const form = document.getElementById("stepForm");
      let firstBad = null;
      for (const id of step.qs) {
        const q = Q[id];
        const card = form.querySelector(`[data-q="${id}"]`);
        let ok = q.optional || (a[id] !== undefined && a[id] !== "");
        if (ok && q.follow && q.follow.required && a[id] === q.follow.when && !a[q.follow.key]) ok = false;
        card.classList.remove("has-error");
        if (!ok) { void card.offsetWidth; card.classList.add("has-error"); }
        if (!ok && !firstBad) firstBad = card;
      }
      if (firstBad) {
        firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
        const f = firstBad.querySelector("input, textarea");
        if (f) setTimeout(() => f.focus({ preventScroll: true }), 300);
        return false;
      }
      return true;
    }

    /* ===================== VIEWS ===================== */
    const app = document.getElementById("app");
    const stepCount = document.getElementById("stepCount");
    const bar = document.getElementById("progressBar");
    let STEPS = [];
    let cur = 0;

    const themeMeta = document.querySelector('meta[name="theme-color"]');
    function setTheme(t) {
      document.body.dataset.theme = t;
      const c = getComputedStyle(document.body).getPropertyValue("--bar-color").trim();
      if (themeMeta && c) themeMeta.content = c;
    }
    function onChange(step, e) {
      readStep(step);
      const a = bucket(step);
      const form = document.getElementById("stepForm");
      for (const id of step.qs) {
        const q = Q[id];
        if (q.follow) {
          const f = form.querySelector(`[data-follow="${q.follow.key}"]`);
          if (f) f.hidden = a[id] !== q.follow.when;
        }
      }
      // clear error once answered
      const card = e.target.closest(".q");
      if (card) card.classList.remove("has-error");
    }

    function next() {
      const step = STEPS[cur];
      readStep(step);
      if (!validateStep(step)) return;
      if (cur === STEPS.length - 1) return submit();
      /* Keep what is answered so far, without making the customer wait. */
      queueSend("partial").catch(err => console.warn("[Handover survey] partial send failed", err));
      render(cur + 1);
    }

    /* ===================== SUBMIT ===================== */
    function payload(status = "complete") {
      if (!REF) REF = "HO90-" + Math.random().toString(36).slice(2, 8).toUpperCase().padEnd(6, "0");
      return {
        survey: "CX-HANDOVER-90D",
        questionSet: QUESTION_SET, // version of the question bank
        lang: LANG,                // language the customer answered in: "en" or "ar"
        ref: REF,
        status,                    // "partial" (moved to the next page) or "complete" (pressed Submit)
        customerId: CUSTOMER.id || null,
        demo: isDemo,
        linkIssues: LINK_ISSUES,
        submittedAt: new Date().toISOString(),
        customer: answers.customer,
        units: UNITS.map((u, i) => ({ unit: u.name, community: u.community, answers: answers.units[i] }))
      };
    }

    function answeredCount() {
      const filled = v => v !== undefined && v !== "";
      return [answers.customer, ...answers.units].reduce((n, b) => n + Object.values(b || {}).filter(filled).length, 0);
    }

    async function send(status) {
      const data = payload(status);
      if (!CONFIG.submitUrl) {
        console.log("[Handover survey] payload", data);
        await new Promise(r => setTimeout(r, 900));
        if (params.get("state") === "error" && status === "complete") throw new Error("Simulated error");
        return;
      }
      /* A stalled connection must not leave the button spinning: give up after 20 s and show the retry message. */
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      let res;
      try {
        res = await fetch(CONFIG.submitUrl, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data), signal: ctrl.signal
        });
      } finally { clearTimeout(timer); }
      if (!res.ok) throw new Error("HTTP " + res.status);
    }
    /* One send at a time, in order: a slow partial can never land after the complete and overwrite it. */
    let lastSend = Promise.resolve();
    function queueSend(status) {
      const p = lastSend.catch(() => { }).then(() => send(status));
      lastSend = p;
      return p;
    }

    function setBusy(btn, busy) {
      if (!btn) return;
      if (busy) {
        btn.dataset.label = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner" aria-hidden="true"></span>${btnLabel("Sending", "جارٍ الإرسال")}`;
      } else {
        btn.disabled = false;
        if (btn.dataset.label) btn.innerHTML = btn.dataset.label;
      }
    }

    async function submit() {
      const btn = document.getElementById("nextBtn") || document.getElementById("retryBtn");
      setBusy(btn, true);
      try {
        await queueSend("complete");
        renderState("success");
      } catch (err) {
        console.warn("[Handover survey] submit failed", err);
        renderState("error");
      }
    }

    /* ===================== VIEW LAYER ===================== */
    const hero = document.getElementById("hero");
    const pad = n => String(n).padStart(2, "0");

    /* ---- live progress for the CURRENT page: one unit per required answer ---- */
    const progressEl = document.getElementById("progress");
    let lastPct = -1;
    function computeProgress() {
      const s = STEPS[cur];
      if (!s || s.kind !== "q") return 0;
      const a = bucket(s);
      const req = s.qs.filter(id => !Q[id].optional);
      const done = req.filter(id => a[id] !== undefined && a[id] !== "").length;
      return req.length ? Math.round(done / req.length * 100) : 0;
    }
    function updateProgress(force) {
      const pct = force !== undefined ? force : computeProgress();
      bar.style.width = pct + "%";
      progressEl.setAttribute("aria-valuenow", pct);
      const p = document.getElementById("pct");
      if (p) p.textContent = pct + "%";
      if (pct > lastPct && lastPct >= 0) {
        progressEl.classList.add("pulse");
        clearTimeout(updateProgress.t);
        updateProgress.t = setTimeout(() => progressEl.classList.remove("pulse"), 700);
      }
      lastPct = pct;
    }
    function setProgress(i) {
      const total = STEPS.length - 1;
      stepCount.innerHTML = i === 0 ? "" : `<span title="${L(`Page ${i} of ${total}`, `الصفحة ${i} من ${total}`)}">${i} / ${total}</span>${STEPS[i].kind === "q" ? `<span class="pct" id="pct" title="${L("Answered on this page", "تمت الإجابة في هذه الصفحة")}"></span>` : ""}`;
      // new page: jump to its current fill without animating backwards, then animate per answer
      bar.style.transition = "none";
      lastPct = -1;
      updateProgress();
      void bar.offsetWidth;
      bar.style.transition = "";
    }

    /* All text arrives in the active language. */
    function heroHtml({ eyebrow, title, unitKey, unitVal, unitOf, num }) {
      return `<div class="fade-in">
      ${eyebrow ? `<p class="eyebrow">${esc(eyebrow)}</p>` : ""}
      <h1>${esc(title)}</h1>
      ${unitVal ? `<div class="hero-unit"><span class="k">${esc(unitKey)}</span><b><bdi>${esc(unitVal)}</bdi></b>${unitOf ? `<span class="of">${esc(unitOf)}</span>` : ""}</div>` : ""}
    </div>
    ${num ? `<div class="hero-num" aria-hidden="true">${num}</div>` : ""}`;
    }

    /* Sticky context bar: once the hero scrolls away, the header keeps showing the survey
       and, on per-unit pages, which unit is being answered. */
    const ctxBar = document.getElementById("ctxBar");
    function setContext(step) {
      if (!step || step.kind !== "q") { ctxBar.innerHTML = ""; ctxBar.hidden = true; return; }
      let who = "";
      if (step.scope === "unit") {
        const of = step.count > 1 ? `<span class="ctx-of">${step.pos}/${step.count}</span>` : "";
        who = `<span class="ctx-who"><span class="ctx-k">${L("Unit", "الوحدة")}</span><b><bdi>${esc(unitLabel(UNITS[step.unit]))}</bdi></b>${of}</span>`;
      }
      ctxBar.innerHTML = `<div class="ctx-inner"><span class="ctx-part">${esc(T(step.part))}</span>${who}</div>`;
      ctxBar.classList.toggle("has-who", !!who);
      ctxBar.hidden = false;
    }
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(([e]) => document.body.classList.toggle("hero-out", !e.isIntersecting),
        { rootMargin: "-80px 0px 0px 0px" }).observe(document.getElementById("hero"));
    } else {
      document.body.classList.add("hero-out");
    }

    /* Bottom bar: while it is pinned over content that continues below, it gets a fade and a
       shadow, so it does not read as the end of the page. At rest (end of page or card) it is flat. */
    function markPinnedNav() {
      const nav = document.querySelector("#app .nav");
      if (!nav) return;
      nav.classList.toggle("is-pinned", nav.parentElement.getBoundingClientRect().bottom > innerHeight + 2);
      if (!nav.querySelector(".more-below")) {
        const more = document.createElement("button");
        more.type = "button";
        more.className = "more-below";
        more.innerHTML = `${esc(L("More below", "المزيد بالأسفل"))}<span aria-hidden="true">↓</span>`;
        more.addEventListener("click", () => scrollBy({ top: innerHeight * 0.6, behavior: "smooth" }));
        nav.prepend(more);
      }
    }
    addEventListener("scroll", markPinnedNav, { passive: true });
    addEventListener("resize", markPinnedNav);
    document.addEventListener("animationend", markPinnedNav);
    new MutationObserver(markPinnedNav).observe(document.getElementById("app"), { childList: true, subtree: true });

    /* Motion helpers */
    const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
    /* Content arrives in sequence: each block rises a beat after the one before it. */
    function stagger(sel) {
      app.querySelectorAll(sel).forEach((el, n) => { el.classList.add("rise"); el.style.setProperty("--i", Math.min(n, 10)); });
    }
    /* Counts in the facts row run up to their value. */
    function countUp() {
      if (calm()) return;
      app.querySelectorAll(".facts b:not(.ref)").forEach(b => {
        const m = b.textContent.match(/^(\d+)(.*)$/);
        if (!m || +m[1] < 2) return;
        const end = +m[1], rest = m[2], t0 = performance.now() + 300;
        const tick = now => {
          const k = Math.max(0, Math.min(1, (now - t0) / 900));
          b.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))) + rest;
          if (k < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    }
    /* A short burst of confetti from the check mark, once (not again on a language switch). */
    const celebrated = new Set();
    function celebrate(key, n) {
      if (celebrated.has(key) || calm() || !Element.prototype.animate) return;
      celebrated.add(key);
      const icon = app.querySelector(".state-icon.ok");
      if (!icon) return;
      const r = icon.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      const css = getComputedStyle(document.body);
      const colors = [css.getPropertyValue("--accent"), css.getPropertyValue("--hero-2"), "#C8A97E", "#E3D3BC", "#8E8A84"];
      for (let k = 0; k < n; k++) {
        const p = document.createElement("i");
        p.className = "confetti";
        p.setAttribute("aria-hidden", "true");
        p.style.cssText = `left:${x}px;top:${y}px;background:${colors[k % colors.length]}`;
        document.body.appendChild(p);
        const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 150, dx = Math.cos(a) * d, dy = Math.sin(a) * d;
        p.animate([
          { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy - 50}px)) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: .55 },
          { transform: `translate(calc(-50% + ${dx * 1.15}px), calc(-50% + ${dy + 110}px)) rotate(${Math.random() * 720}deg) scale(.7)`, opacity: 0 }
        ], { duration: 1200 + Math.random() * 700, delay: 280, easing: "cubic-bezier(.2,.7,.3,1)", fill: "both" }).onfinish = () => p.remove();
      }
    }

    function render(i, focusTop = true) {
      document.body.dataset.dir = i > cur ? "fwd" : i < cur ? "back" : "";
      cur = i;
      const step = STEPS[i];
      setTheme(step.theme);
      setProgress(i);
      document.body.classList.remove("co-brand", "closing");
      document.body.classList.toggle("is-intro", step.kind === "intro");
      if (step.kind === "intro") return renderIntro();
      redraw = () => { readStep(step); render(cur, false); };

      let unitKey = "", unitVal = "", unitOf = "";
      if (step.scope === "unit") {
        unitKey = L("Unit", "الوحدة"); unitVal = unitLabel(UNITS[step.unit]);
        if (step.count > 1) unitOf = L(`${step.pos} of ${step.count}`, `${step.pos} من ${step.count}`);
      }
      hero.innerHTML = heroHtml({ eyebrow: T(step.part), title: T(step.title), unitKey, unitVal, unitOf, num: pad(i) });
      setContext(step);

      const last = i === STEPS.length - 1;
      app.innerHTML = `<div class="fade-in">
    <form id="stepForm" novalidate>
      ${step.qs.map(id => renderQuestion(id, step)).join("")}
      <div class="nav">
        <button type="button" class="btn ghost" id="backBtn">${btnLabel("Back", "رجوع")}</button>
        <button type="submit" class="btn" id="nextBtn">${last ? btnLabel("Submit answers", "إرسال الإجابات")
          : btnLabel("Continue", "متابعة") + '<span class="arrow" aria-hidden="true">→</span>'}</button>
      </div>
    </form></div>`;

      const form = document.getElementById("stepForm");
      form.addEventListener("change", e => onChange(step, e));
      form.addEventListener("change", () => updateProgress());
      form.addEventListener("submit", e => { e.preventDefault(); next(); });
      document.getElementById("backBtn").addEventListener("click", () => { readStep(step); render(cur - 1); });
      stagger(".q");
      if (focusTop) { window.scrollTo({ top: 0 }); app.focus({ preventScroll: true }); }
    }

    function renderIntro() {
      redraw = renderIntro;
      const n = UNITS.length;
      const qn = W.unitPage.qs.length * n + (W.customerPage ? W.customerPage.qs.length : 0);
      const mins = W.minutes + (n > 1 ? n - 1 : 0);
      const name = CUSTOMER.name ? `<bdi>${esc(CUSTOMER.name)}</bdi>` : "";
      setContext(null);
      hero.innerHTML = heroHtml({ eyebrow: "G Developments", title: T(W.title) });
      const greeting = isAr() ? (name ? `عزيزي/عزيزتي ${name}،` : "عزيزي مالك الوحدة،") : (name ? `Dear ${name},` : "Dear Valued Homeowner,");
      const facts = isAr()
        ? [[mins, arCount(mins, "دقيقة تقريبًا", "دقيقتان تقريبًا", "دقائق تقريبًا", "دقيقة تقريبًا")],
        [n, arCount(n, "وحدة مشمولة", "وحدتان مشمولتان", "وحدات مشمولة", "وحدة مشمولة")],
        [qn, arCount(qn, "سؤال", "سؤالان", "أسئلة", "سؤالًا")]]
        : [[`${mins} min`, "Estimated time"],
        [n, n === 1 ? "Property included" : "Properties included"],
        [qn, qn === 1 ? "Question" : "Questions"]];
      app.innerHTML = `<div class="panel fade-in">
    <p class="greeting">${greeting}</p>
    <div class="intro-copy"><p>${esc(T(W.intro))}</p><p>${L("Thank you for taking the time to share your thoughts with us.", "شكراً لتخصيص وقتك ومشاركتنا رأيك.")}</p></div>
    <div class="facts">${facts.map(([v, k]) => `<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("")}</div>
    <h2 class="next-title units-title">${L(n === 1 ? "Your property" : "Your properties", n === 1 ? "وحدتك" : "وحداتك")}</h2>
    <div class="units">${UNITS.map(u => `<div class="unit-card"><b><bdi>${unitLabel(u).split(" · ").map(p => `<span>${esc(p)}</span>`).join(" · ")}</bdi></b><span class="pill handed">${L("Handed over", "تم الاستلام")}</span></div>`).join("")}</div>
    ${STEPS.length > 2 ? `<p class="muted">${L("Your answers are saved as you move from one page to the next.", "يتم حفظ إجاباتك أثناء انتقالك من صفحة إلى أخرى.")}</p>` : ""}
    <div class="nav" style="justify-content:flex-end"><button class="btn" id="startBtn" type="button">${btnLabel("Start survey", "ابدأ الاستبيان")}<span class="arrow" aria-hidden="true">→</span></button></div>
  </div>`;
      document.getElementById("startBtn").addEventListener("click", () => render(1));
      stagger(".greeting, .intro-copy > p, .facts > div, .units-title, .unit-card, .panel > .muted");
      countUp();
    }

    function renderState(kind) {
      document.body.dataset.dir = "";
      redraw = () => renderState(kind);
      setTheme("gd");
      document.body.classList.remove("co-brand", "is-intro");
      document.body.classList.add("closing");
      stepCount.textContent = "";
      if (kind === "success") updateProgress(100);
      const titles = { success: "Thank You for Sharing Your Feedback", error: "We couldn't send your answers", invalid: "This survey link isn't valid" };
      const titlesAr = { success: "شكرًا لمشاركتنا رأيك", error: "تعذر إرسال إجاباتك", invalid: "رابط الاستبيان غير صالح" };
      setContext(null);
      hero.innerHTML = heroHtml({ eyebrow: W ? T(W.title) : "G Developments", title: L(titles[kind], titlesAr[kind]) });
      const icons = {
        ok: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
        err: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 16.5v.5"/></svg>`
      };
      let views = {
        invalid: `<div class="state-icon err">${icons.err}</div>
      <p>${L("The link may be incomplete or out of date. Please open the survey from the original email or WhatsApp message.",
          "قد يكون الرابط غير مكتمل أو منتهي الصلاحية. يرجى فتح الاستبيان من رسالة البريد الإلكتروني أو واتساب الأصلية.")}</p>`
      };
      if (kind !== "invalid") {
        if (kind === "success" && !REF) payload(); // assigns the reference when previewing
        const count = answeredCount();
        const nUnits = UNITS.length;
        const issues = answers.units.some(a => a.D8 === "Yes");
        /* What happens next depends on the wave and, at 90 days, on whether an issue was reported (D8). */
        const nextSteps = [
          W.id === "90d"
            ? issues
              ? L("You told us about an outstanding issue, so a member of our team will contact you to follow it up.",
                "أخبرتنا بوجود ملاحظة لم تتم معالجتها بعد، لذلك سيتواصل معك أحد أعضاء فريقنا لمتابعتها.")
              : L("You told us there are no outstanding issues from your handover. Thank you for confirming.",
                "أخبرتنا بعدم وجود أي ملاحظات متبقية من استلام وحدتك. شكرًا لتأكيدك.")
            : L("Our team reviews your answers to keep improving the handover experience for every homeowner.",
              "يراجع فريقنا إجاباتك لمواصلة تحسين تجربة استلام الوحدات لجميع الملاك."),
          L("If you need to reach us in the meantime, quote your reference so we can find your answers.",
            "إذا احتجت إلى التواصل معنا في هذه الأثناء، اذكر رقمك المرجعي حتى نتمكن من الوصول إلى إجاباتك.")
        ];
        const GD = "<b><bdi>G Developments</bdi></b>";
        const closingParas = [
          L("Thank you for taking the time to share your experience with us.", "نشكرك على تخصيص وقتك لمشاركة تجربتك معنا."),
          L("Your feedback helps us better understand your needs, continuously enhance our services, and make every stage of your journey with G Developments a better experience.",
            "تساعدنا آراؤك على فهم احتياجاتك بشكل أفضل، وتطوير خدماتنا باستمرار، والارتقاء بتجربتك في كل مرحلة من رحلتك مع <bdi>G Developments</bdi>."),
          L(`At ${GD}, we remain committed to delivering the quality, care, and service you deserve.`,
            `في ${GD}، نواصل التزامنا بتقديم مستوى الجودة والاهتمام والخدمة الذي تستحقه.`),
          `<b>${L("Your trust inspires us. Your feedback helps us grow.", "ثقتك مصدر إلهامنا، ورأيك يساعدنا على التطور.")}</b>`
        ];
        const unitsLabel = isAr() ? arCount(nUnits, "وحدة", "وحدتان", "وحدات", "وحدة") : (nUnits === 1 ? "unit" : "units");
        views = {
          ...views,
          success: `<div class="state-icon ok">${icons.ok}</div>
      <p class="confirm">${L("Your responses have been successfully submitted", "تم إرسال إجاباتك بنجاح")}</p>
      <div class="closing-msg">${closingParas.map(t => `<p>${t}</p>`).join("")}</div>
      <div class="facts">
        <div><b>${count || "—"}</b>${L("answers recorded", "الإجابات المسجلة")}</div>
        <div><b>${nUnits || "—"}</b>${unitsLabel}</div>
        <div><b class="ref"><bdi>${esc(REF || "—")}</bdi></b>${L("your reference", "رقمك المرجعي")}</div>
      </div>
      <h2 class="next-title">${L("What happens next", "الخطوات التالية")}</h2>
      <ol class="next-steps">${nextSteps.map((t, n) => `<li><span>${pad(n + 1)}</span>${t}</li>`).join("")}</ol>
      <p class="muted">${L("You can now close this page.", "يمكنك الآن إغلاق هذه الصفحة.")}</p>`,
          error: `<div class="state-icon err">${icons.err}</div>
      <p class="lead">${L("Something went wrong on our side. Your answers are still on this page, so nothing is lost.",
            "حدث خطأ من جانبنا. إجاباتك لا تزال محفوظة في هذه الصفحة، يرجى المحاولة مرة أخرى.")}</p>
      <div class="err-box">${L("Check your internet connection, then press <b>Try again</b>. If it keeps failing, keep this page open and try again in a few minutes.",
              "تحقق من اتصالك بالإنترنت، ثم اضغط <b>حاول مرة أخرى</b>. إذا استمرت المشكلة، اترك هذه الصفحة مفتوحة وحاول مرة أخرى بعد بضع دقائق.")}</div>
      <div class="nav" style="justify-content:flex-start"><button class="btn" id="retryBtn" type="button">${btnLabel("Try again", "حاول مرة أخرى")}</button>
      <button class="btn ghost" id="reviewBtn" type="button">${btnLabel("Review answers", "مراجعة الإجابات")}</button></div>`
        };
      }
      app.innerHTML = `<div class="panel fade-in" role="${kind === "error" ? "alert" : "status"}">${views[kind]}</div>`;
      stagger(".panel > .lead, .panel > p, .closing-msg p, .err-box, .facts > div, .next-title, .next-steps li");
      countUp();
      window.scrollTo({ top: 0 });
      if (kind === "success") celebrate("success", 48);
      if (kind === "error") {
        document.getElementById("retryBtn").addEventListener("click", submit);
        document.getElementById("reviewBtn").addEventListener("click", () => render(STEPS.length - 1));
      }
    }


    /* ===================== BOOT ===================== */
    if (LINK_ISSUES.length) console.warn("[Handover survey] link issues", LINK_ISSUES);
    try {
      if (!UNITS || !W) {
        renderState("invalid");
      } else {
        STEPS = buildSteps();
        const preview = params.get("state");
        // Preview: ?state=success | invalid shows that screen directly (?state=error&preview=1 for the error screen).
        // ?state=error without ?preview=1 runs the survey and makes the final send fail.
        if (preview === "success" || preview === "invalid" || (preview === "error" && params.get("preview") === "1")) renderState(preview);
        else render(0);
      }
    } catch (err) {
      /* Never leave a blank page: anything unexpected while building the survey shows the invalid-link screen. */
      console.error("[Handover survey] could not start", err);
      try { renderState("invalid"); } catch (e) { document.body.innerHTML = "<p style='padding:24px;font-family:sans-serif'>This survey link isn't valid. · رابط الاستبيان غير صالح</p>"; }
    }

  </script>
</body>

</html>
