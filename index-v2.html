    /* ===================== SECTIONS =====================
       Consecutive steps of the same Part form one section; in Part E each community is its own
       section. At the end of a section the answers so far are sent, then the customer chooses to
       continue with the next section or finish there. */
    let SECTIONS = [];
    const sent = new Set();      // ids of sections whose answers have been sent
    let endedEarly = false;

    function buildSections(steps) {
      const out = [];
      steps.forEach((s, i) => {
        if (s.kind !== "q") return;
        const key = s.part + "|" + (s.community || "");
        const last = out[out.length - 1];
        if (last && last.key === key) {
          last.to = i;
          if (s.scope === "unit") last.units.add(s.unit);
          return;
        }
        const letter = (/^Part ([A-E])/.exec(s.part) || [])[1];
        out.push({
          key, id: (letter || s.part) + (s.community ? ":" + s.community : ""), part: s.part,
          community: s.community || null, from: i, to: i, units: new Set(s.scope === "unit" ? [s.unit] : [])
        });
      });
      return out;
    }
    const sectionAt = i => SECTIONS.find(s => i >= s.from && i <= s.to);
    const secName = s => s.community ? `${s.part} — ${s.community}` : s.part;
    const secNameAr = s => (PART_AR[s.part] || s.part) + (s.community ? ` — ${COMMUNITY_AR[s.community] || s.community}` : "");
    /* Unit names, only for sections that cover some of the customer's units (Part C or D). */
    function secWho(s) {
      const u = [...s.units];
      return u.length && u.length < UNITS.length ? u.map(i => unitLabel(UNITS[i])).join(" · ") : "";
    }
    /* Rough time to answer: about 7 seconds per answer (each matrix row counts). */
    function secMinutes(s) {
      let n = 0;
      for (let i = s.from; i <= s.to; i++) {
        for (const id of STEPS[i].qs) n += Q[id].type === "matrix" ? itemsOf(Q[id], STEPS[i].community).length : 1;
      }
      return Math.max(1, Math.round(n * 7 / 60));
    }
    const minsAr = n => n === 1 ? "دقيقة واحدة تقريبًا" : n === 2 ? "دقيقتان تقريبًا" : n <= 10 ? `${n} دقائق تقريبًا` : `${n} دقيقة تقريبًا`;

    /* ===================== RENDER HELPERS ===================== */
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const sub = (t, c) => c ? t.replaceAll("[Community]", c) : t;
    const subAr = (t, c) => c ? t.replaceAll("[Community]", COMMUNITY_AR[c] || c) : t;
    /* ===================== LANGUAGE =====================
       One language at a time. Default: Arabic when the browser's first language is Arabic,
       otherwise English. The choice made with the header switch is remembered on the device.
       Every view renders in LANG; switching re-renders the current view (answers are kept). */
    const LANG_KEY = "cx26-lang";
    let LANG = (() => {
      try { const v = localStorage.getItem(LANG_KEY); if (v === "en" || v === "ar") return v; } catch (e) { }
      const first = (navigator.languages && navigator.languages[0]) || navigator.language || "";
      return /^ar\b/i.test(first) ? "ar" : "en";
    })();
    const isAr = () => LANG === "ar";
    /* The active language's text; falls back to English when there is no Arabic. */
    const L = (en, ar) => isAr() && ar ? ar : en;
    const qText = (o, c) => isAr() && o.ar ? subAr(o.ar, c) : sub(o.en, c);
    /* Unit names stay as in the contract; the community part is written in Arabic in Arabic. */
    const unitLabel = u => isAr() && u.community ? `${COMMUNITY_AR[u.community] || u.community} · ${u.name}` : u.label;
    const commName = c => L(c, COMMUNITY_AR[c]);
    /* Arabic noun after a number: 1, 2 (dual), 3–10 (plural), 11+ (singular). */
    const arCount = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : n <= 10 ? few : many;
    let redraw = null;           // re-renders the current view in the new language

    function applyLang() {
      document.documentElement.lang = LANG;
      document.documentElement.dir = isAr() ? "rtl" : "ltr";
      document.title = L("Customer Experience Survey 2026 · G Developments", "استبيان تجربة العملاء 2026 · G Developments");
      document.getElementById("progress").setAttribute("aria-label", L("Section progress", "تقدم القسم"));
      document.querySelectorAll("#langSwitch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
    }
    document.getElementById("langSwitch").addEventListener("click", e => {
      const b = e.target.closest("button[data-lang]");
      if (!b || b.dataset.lang === LANG) return;
      LANG = b.dataset.lang;
      try { localStorage.setItem(LANG_KEY, LANG); } catch (err) { }
      applyLang();
      // While answers are being sent the view stays as it is; the next view opens in the new language.
      if (redraw && !document.querySelector("#app .spinner")) redraw();
    });
    applyLang();

    const bi = (en, ar) => esc(L(en, ar));
    const btnLabel = (en, ar) => `<span class="btn-label">${esc(L(en, ar))}</span>`;
    const optHtml = o => esc(L(o, OPT_AR[o]));
    let uid = 0;
    const nid = () => "f" + (++uid);

    function bucket(step) {
      if (step.scope === "unit") return answers.units[step.unit];
      if (step.scope === "community") return answers.communities[step.community];
      return answers.customer;
    }

    function labelBlock(id, q, c, tag = "div") {
      return `<${tag} class="q-label"><span class="q-num">${esc(id)}</span>${esc(sub(q.en, c))}${q.optional ? '<span class="opt-tag">Optional</span>' : ""}
    <span class="ar" lang="ar">${esc(sub(q.ar, c))}</span></${tag}>${q.hint ? `<div class="q-hint">${esc(q.hint)}</div>` : ""}`;
    }

    /* Each "n = label" pair is isolated so the bidi algorithm can't swap numbers and labels. */
    function satLegendAr() {
      return `<span class="ar legend-ar" lang="ar" dir="rtl"><bdi>1★ = ${esc(SAT.ar[0])}</bdi> · <bdi>5★ = ${esc(SAT.ar[1])}</bdi></span>`;
    }
    const satLegend = () => `<bdi>1 = ${esc(L(SAT.en[0], SAT.ar[0]))}</bdi> · <bdi>5 = ${esc(L(SAT.en[1], SAT.ar[1]))}</bdi>`;

    function anchorsFor(q) {
      if (q.type === "nps") return { en: ["Not at all likely", "Extremely likely"], ar: ["غير محتمل إطلاقًا", "محتمل جدًا"] };
      return q.anchors || SAT;
    }
    function anchorsHtml(a) {
      return `<div class="anchors"><div>${esc(L(a.en[0], a.ar && a.ar[0]))}</div><div>${esc(L(a.en[1], a.ar && a.ar[1]))}</div></div>`;
    }

    const STAR_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z"/></svg>`;

    /* 1–5 scales render as stars; the NPS 0–10 scale stays numeric. Values submitted are unchanged. */
    function scaleHtml(name, from, to, val, extraClass = "") {
      const stars = extraClass !== "nps";
      let h = `<div class="scale ${stars ? "stars" : ""} ${extraClass}">`;
      for (let n = from; n <= to; n++) {
        const of = `${n} ${L("of", "من")} ${to}`;
        const face = stars ? `${STAR_SVG}<span class="sr-only">${of}</span>` : n;
        h += `<label${stars ? ` title="${of}"` : ""}><input type="radio" name="${name}" value="${n}" ${String(val) === String(n) ? "checked" : ""}><span class="box">${face}</span></label>`;
      }
      return h + "</div>";
    }

    function matrixBody(q, a, c) {
      let body = `<div class="legend-line"><span>1★ = ${esc(SAT.en[0])} · 5★ = ${esc(SAT.en[1])}</span>${satLegendAr()}</div>`;
      for (const it of itemsOf(q, c)) {
        body += `<div class="m-row" data-item="${esc(it.id)}" role="radiogroup" aria-label="${esc(sub(it.en, c))}">
        <div class="m-label"><span><span class="q-num">${esc(it.id)}</span>${esc(sub(it.en, c))}</span><span class="ar" lang="ar">${esc(sub(it.ar, c))}</span></div>
        <div class="m-controls">${scaleHtml(it.id, 1, 5, a[it.id])}
          ${q.na ? `<label class="na"><input type="radio" name="${it.id}" value="N/A" ${a[it.id] === "N/A" ? "checked" : ""}><span class="box">N/A</span></label>` : ""}
        </div></div>`;
      }
      return body;
    }

    function renderQuestion(id, step) {
      const q = Q[id], a = bucket(step), c = step.community, name = id;
      const hidden = q.showIf && !q.showIf(a) ? "hidden" : "";
      let body = "";

      if (q.type === "nps") {
        body = scaleHtml(name, 0, 10, a[id], "nps") + anchorsHtml(anchorsFor(q));
      } else if (q.type === "rating") {
        body = scaleHtml(name, 1, 5, a[id]) + anchorsHtml(anchorsFor(q));
        if (q.na) body += `<div class="na-row"><label><input type="radio" name="${name}" value="N/A" ${a[id] === "N/A" ? "checked" : ""}><span class="box">${esc(qText(q.naLabel || NA_LABEL))}</span></label></div>`;
      } else if (q.type === "matrix") {
        body = matrixBody(q, a, c);
      } else if (q.type === "single" || q.type === "yesno") {
        const opts = q.type === "yesno" ? ["Yes", "No"] : q.options;
        body = `<div class="choices ${q.type === "yesno" ? "yesno" : ""}">` + opts.map(o =>
          `<label><input type="radio" name="${name}" value="${esc(o)}" ${a[id] === o ? "checked" : ""}><span class="box">${optHtml(o)}</span></label>`).join("") + "</div>";
      } else if (q.type === "multi") {
        const v = a[id] || [];
        body = `<div class="chips">` + q.options.map(o =>
          `<label><input type="checkbox" name="${name}" value="${esc(o)}" ${v.includes(o) ? "checked" : ""}><span class="box">${optHtml(o)}</span></label>`).join("") + "</div>";
      } else if (q.type === "text") {
        const fid = nid();
        return `<div class="q" data-q="${id}" ${hidden}>
      <label class="q-label" for="${fid}"><span class="q-num">${esc(id)}</span>${esc(qText(q, c))}${q.optional ? `<span class="opt-tag">${L("Optional", "اختياري")}</span>` : ""}</label>
      <div class="q-body"><textarea id="${fid}" name="${name}" maxlength="2000">${esc(a[id] || "")}</textarea></div>
      <div class="q-error" role="alert">${L("Please answer this question.", "يرجى الإجابة على هذا السؤال.")}</div></div>`;
      }

      let follow = "";
      if (q.follow) {
        const fid = nid();
        const cur = a[id];
        const show = Array.isArray(cur) ? cur.includes(q.follow.when) : cur === q.follow.when;
        follow = `<div class="follow" data-follow="${q.follow.key}" ${show ? "" : "hidden"}>
      <label for="${fid}">${bi(q.follow.label, UI_AR[q.follow.label])}${q.follow.required ? "" : ` <span class="opt-tag">${L("Optional", "اختياري")}</span>`}</label>
      ${q.follow.key === "D8_detail" ? `<textarea id="${fid}" name="${q.follow.key}" maxlength="1000">${esc(a[q.follow.key] || "")}</textarea>`
            : `<input type="text" id="${fid}" name="${q.follow.key}" maxlength="200" value="${esc(a[q.follow.key] || "")}">`}
    </div>`;
      }

      return `<div class="q" data-q="${id}" ${hidden}><fieldset>
    <legend>${labelBlock(id, q, c, "span")}</legend>
    <div class="q-body">${body}${follow}</div>
    <div class="q-error" role="alert">${q.type === "matrix"
          ? L("Please rate every item, or choose N/A.", "يرجى تقييم كل بند أو اختيار لا ينطبق.")
          : L("Please answer this question.", "يرجى الإجابة على هذا السؤال.")}</div>
  </fieldset></div>`;
    }

    /* ===================== READ / VALIDATE ===================== */
    function readStep(step) {
      const a = bucket(step);
      const form = document.getElementById("stepForm");
      for (const id of step.qs) {
        const q = Q[id];
        if (q.type === "matrix") {
          for (const it of itemsOf(q, step.community)) {
            const el = form.querySelector(`input[name="${CSS.escape(it.id)}"]:checked`);
            if (el) a[it.id] = el.value === "N/A" ? "N/A" : Number(el.value);
          }
        } else if (q.type === "multi") {
          a[id] = [...form.querySelectorAll(`input[name="${id}"]:checked`)].map(e => e.value);
        } else if (q.type === "text") {
          a[id] = form.querySelector(`[name="${id}"]`).value.trim();
        } else {
          const el = form.querySelector(`input[name="${id}"]:checked`);
          if (el) a[id] = (q.type === "nps" || q.type === "rating") && el.value !== "N/A" ? Number(el.value) : el.value;
        }
        if (q.follow) {
          const f = form.querySelector(`[name="${q.follow.key}"]`);
          const on = Array.isArray(a[id]) ? a[id].includes(q.follow.when) : a[id] === q.follow.when;
          if (on && f) a[q.follow.key] = f.value.trim(); else delete a[q.follow.key];
        }
        if (q.showIf && !q.showIf(a)) { delete a[id]; if (q.follow) delete a[q.follow.key]; }
      }
    }

    function validateStep(step) {
      const a = bucket(step);
      const form = document.getElementById("stepForm");
      let firstBad = null;
      for (const id of step.qs) {
        const q = Q[id];
        const card = form.querySelector(`[data-q="${id}"]`);
        if (q.showIf && !q.showIf(a)) { card.classList.remove("has-error"); continue; }
        let ok = true;
        if (q.type === "matrix") {
          for (const it of itemsOf(q, step.community)) {
            const row = card.querySelector(`[data-item="${CSS.escape(it.id)}"]`);
            const good = a[it.id] !== undefined;
            row.classList.toggle("has-error", !good);
            if (!good) ok = false;
          }
        } else if (!q.optional) {
          const v = a[id];
          ok = Array.isArray(v) ? v.length > 0 : (v !== undefined && v !== "");
        }
        if (ok && q.follow && q.follow.required) {
          const on = a[id] === q.follow.when;
          if (on && !a[q.follow.key]) ok = false;
        }
        card.classList.toggle("has-error", !ok);
        if (!ok && !firstBad) firstBad = card;
      }
      if (firstBad) {
        firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
        const f = firstBad.querySelector("input, textarea");
        if (f) setTimeout(() => f.focus({ preventScroll: true }), 300);
        return false;
      }
      return true;
    }

    /* ===================== VIEWS ===================== */
    const app = document.getElementById("app");
    const stepCount = document.getElementById("stepCount");
    const bar = document.getElementById("progressBar");
    let STEPS = [];
    let cur = 0;

    const themeMeta = document.querySelector('meta[name="theme-color"]');
    function setTheme(t) {
      document.body.dataset.theme = t;
      const c = getComputedStyle(document.body).getPropertyValue("--bar-color").trim();
      if (themeMeta && c) themeMeta.content = c;
    }
    function setProgress(i) {
      const qSteps = STEPS.length - 1;
      if (i === 0) { stepCount.textContent = ""; bar.style.width = "0%"; return; }
      stepCount.textContent = `Step ${i} of ${qSteps}`;
      bar.style.width = `${Math.round((i - 1) / qSteps * 100)}%`;
    }

    function render(i, focusTop = true) {
      cur = i;
      const step = STEPS[i];
      setTheme(step.theme);
      setProgress(i);
      document.body.classList.toggle("co-brand", step.kind === "intro");
      if (step.kind === "intro") return renderIntro();

      let unitTag = "";
      if (step.scope === "unit") {
        const u = UNITS[step.unit];
        unitTag = `<div class="unit-tag"><span>Unit</span><b>${esc(u.label)}</b>${UNITS.length > 1 ? `<span class="unit-of">${step.unit + 1} of ${UNITS.length}</span>` : ""}</div>`;
      } else if (step.scope === "community") {
        unitTag = `<div class="unit-tag"><span>Community</span><b>${esc(step.community)}</b><span class="unit-of">${esc(step.sub)}</span></div>`;
      }

      const last = i === STEPS.length - 1;
      app.innerHTML = `<div class="fade-in">
    ${step.handoff ? `<div class="handoff">The next questions are about living in your community, which is managed by <b>G Communities</b>.</div>` : ""}
    <div class="section-head">
      <p class="eyebrow">${esc(step.part)}</p>
      <h1>${esc(step.title)}</h1>
      ${unitTag}
      ${step.note ? `<p class="section-note">${esc(step.note)}</p>` : ""}
    </div>
    <form id="stepForm" novalidate>
      ${step.qs.map(id => renderQuestion(id, step)).join("")}
      <div class="nav">
        <button type="button" class="btn ghost" id="backBtn">Back</button>
        <button type="submit" class="btn" id="nextBtn">${last ? "Submit" : "Next"}</button>
      </div>
    </form></div>`;

      const form = document.getElementById("stepForm");
      form.addEventListener("change", e => onChange(step, e));
      form.addEventListener("submit", e => { e.preventDefault(); next(); });
      document.getElementById("backBtn").addEventListener("click", () => { readStep(step); render(cur - 1); });
      if (focusTop) { window.scrollTo({ top: 0 }); app.focus({ preventScroll: true }); }
    }

    function onChange(step, e) {
      readStep(step);
      const a = bucket(step);
      const form = document.getElementById("stepForm");
      // conditional questions
      for (const id of step.qs) {
        const q = Q[id];
        if (q.showIf) form.querySelector(`[data-q="${id}"]`).hidden = !q.showIf(a);
        if (q.follow) {
          const on = Array.isArray(a[id]) ? a[id].includes(q.follow.when) : a[id] === q.follow.when;
          const f = form.querySelector(`[data-follow="${q.follow.key}"]`);
          if (f) f.hidden = !on;
        }
      }
      // clear error once answered
      const card = e.target.closest(".q");
      if (card && card.classList.contains("has-error")) {
        const row = e.target.closest(".m-row");
        if (row) row.classList.remove("has-error");
        if (!card.querySelector(".m-row.has-error")) card.classList.remove("has-error");
      }
    }

    function next() {
      const step = STEPS[cur];
      readStep(step);
      if (!validateStep(step)) return;
      if (cur === STEPS.length - 1) return submit();
      const sec = sectionAt(cur);
      if (sec && sec.to === cur) return submitSection(sec);
      render(cur + 1);
    }

    function renderIntro() {
      const handed = UNITS.some(u => u.stage === "handed");
      const mins = handed ? "about 8 minutes" : "about 4 minutes";
      app.innerHTML = `<div class="panel fade-in">
    <p class="eyebrow">Customer Experience Survey 2026</p>
    <h1>${CUSTOMER.name ? `Dear ${esc(CUSTOMER.name)},` : "Dear customer,"}</h1>
    <p>Thank you for being part of G Developments. We would like to hear how we are doing, from your account and your unit's progress to life in your community.</p>
    <div class="facts">
      <div><b>${mins}</b>to complete</div>
      <div><b>${UNITS.length} ${UNITS.length === 1 ? "unit" : "units"}</b>covered in this survey</div>
    </div>
    <ul class="unit-list">${UNITS.map(u => `<li><span>${esc(u.label)}</span><span class="stage">${STAGE_LABEL[u.stage]}</span></li>`).join("")}</ul>
    <p class="muted">Your answers are linked to your unit${UNITS.length > 1 ? "s" : ""} so that we can follow up on anything that needs attention.</p>
    <div class="nav" style="justify-content:flex-end"><button class="btn" id="startBtn" type="button">Start survey</button></div>
  </div>`;
      document.getElementById("startBtn").addEventListener("click", () => render(1));
    }

    function renderState(kind) {
      setTheme("gd");
      document.body.classList.add("co-brand");
      stepCount.textContent = "";
      bar.style.width = kind === "success" ? "100%" : bar.style.width;
      const icons = {
        ok: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
        err: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 7v6M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>`
      };
      const views = {
        success: `<div class="state-icon">${icons.ok}</div>
      <h1>Thank you</h1>
      <p>Your answers have been received. They go directly to the teams responsible for each part of your experience.</p>
      ${answers.customer.A8 === "Yes" ? `<p class="muted">Since you agreed to be contacted, a member of our team may reach out about your answers.</p>` : ""}
      <p class="muted">You can now close this page.</p>`,
        error: `<div class="state-icon err">${icons.err}</div>
      <h1>We couldn't send your answers</h1>
      <p>Something went wrong on our side. Your answers are still on this page, so please try again.</p>
      <div class="nav" style="justify-content:flex-start"><button class="btn" id="retryBtn" type="button">Try again</button>
      <button class="btn ghost" id="reviewBtn" type="button">Review answers</button></div>`,
        invalid: `<div class="state-icon err">${icons.err}</div>
      <h1>This survey link isn't valid</h1>
      <p>The link may be incomplete or out of date. Please open the survey from the original email or WhatsApp message.</p>`
      };
      app.innerHTML = `<div class="panel fade-in" role="status">${views[kind]}</div>`;
      window.scrollTo({ top: 0 });
      if (kind === "error") {
        document.getElementById("retryBtn").addEventListener("click", submit);
        document.getElementById("reviewBtn").addEventListener("click", () => render(STEPS.length - 1));
      }
    }

    /* ===================== SUBMIT ===================== */
    function payload(status = "complete", early = false) {
      if (!REF) REF = "CX26-" + Math.random().toString(36).slice(2, 8).toUpperCase();
      return {
        survey: "CX-2026",
        ref: REF,
        status,                    // "partial" (end of a section) or "complete" (the customer finished)
        endedEarly: early,
        sectionsDone: SECTIONS.filter(s => sent.has(s.id)).map(s => s.id),
        sectionsTotal: SECTIONS.length,
        customerId: CUSTOMER.id || null,
        demo: isDemo,
        linkIssues: LINK_ISSUES,
        submittedAt: new Date().toISOString(),
        customer: answers.customer,
        units: UNITS.map((u, i) => ({ unit: u.name, project: u.community, stage: u.stage, community: u.community, answers: answers.units[i] })),
        communities: Object.entries(answers.communities).map(([community, a]) => ({ community, answers: a }))
      };
    }

    function answeredCount() {
      const filled = v => Array.isArray(v) ? v.length > 0 : v !== undefined && v !== "";
      const buckets = [answers.customer, ...answers.units, ...Object.values(answers.communities)];
      return buckets.reduce((n, b) => n + Object.values(b || {}).filter(filled).length, 0);
    }

    async function send(status, early = false) {
      const data = payload(status, early);
      if (!CONFIG.submitUrl) {
        console.log("[CX survey] payload", data);
        await new Promise(r => setTimeout(r, 900));
        if (params.get("state") === "error") throw new Error("Simulated error");
        return;
      }
      /* A stalled connection must not leave the button spinning: give up after 20 s and show the retry message. */
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      let res;
      try {
        res = await fetch(CONFIG.submitUrl, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data), signal: ctrl.signal
        });
      } finally { clearTimeout(timer); }
      if (!res.ok) throw new Error("HTTP " + res.status);
    }

    function setBusy(btn, busy) {
      if (!btn) return;
      if (busy) {
        btn.dataset.label = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner" aria-hidden="true"></span>${btnLabel("Sending", "جارٍ الإرسال")}`;
      } else {
        btn.disabled = false;
        if (btn.dataset.label) btn.innerHTML = btn.dataset.label;
      }
    }

    /* Shown above the buttons when a section can't be sent; the customer stays where they are. */
    function showSendError() {
      let box = app.querySelector(".send-err");
      if (!box) {
        box = document.createElement("div");
        box.className = "err-box send-err";
        box.setAttribute("role", "alert");
        box.innerHTML = L("We couldn't send your answers. Check your internet connection and try again.",
          "تعذر إرسال إجاباتك. تحقق من اتصالك بالإنترنت وحاول مرة أخرى.");
        app.querySelector(".nav").before(box);
      }
      box.hidden = false;
    }

    async function submitSection(sec) {
      const btn = document.getElementById("nextBtn");
      const had = sent.has(sec.id);
      sent.add(sec.id);
      setBusy(btn, true);
      try {
        await send("partial");
        renderCheckpoint(sec);
      } catch (err) {
        console.warn("[CX survey] section send failed", err);
        if (!had) sent.delete(sec.id);
        setBusy(btn, false);
        showSendError();
      }
    }

    async function finishEarly() {
      const btn = document.getElementById("finishBtn");
      const other = document.getElementById("continueBtn");
      setBusy(btn, true);
      other.disabled = true;
      try {
        await send("complete", true);
        endedEarly = true;
        renderState("success");
      } catch (err) {
        console.warn("[CX survey] finish failed", err);
        setBusy(btn, false);
        other.disabled = false;
        showSendError();
      }
    }

    async function submit() {
      const btn = document.getElementById("nextBtn") || document.getElementById("retryBtn");
      const sec = SECTIONS[SECTIONS.length - 1];
      const had = sent.has(sec.id);
      sent.add(sec.id);
      setBusy(btn, true);
      try {
        await send("complete");
        endedEarly = false;
        renderState("success");
      } catch (err) {
        console.warn("[CX survey] submit failed", err);
        if (!had) sent.delete(sec.id);
        renderState("error");
      }
    }


    /* ===================== DIRECTION B: VIEW LAYER ===================== */
    const hero = document.getElementById("hero");
    const layout = document.getElementById("layout");
    const SHORT = {
      A1: "Your experience", B2: "Staying in touch", B1: "Account", C1: "Construction & delivery",
      D0: "Handover look-back", E1: "Places & facilities", E5: "Service & app", E8: "Your summer", A7: "Before you go"
    };
    const pad = n => String(n).padStart(2, "0");

    function labelBlock(id, q, c, tag = "div") {
      return `<span class="q-head"><${tag} class="q-label"><span class="q-num">${esc(id)}</span>${esc(qText(q, c))}${q.optional ? `<span class="opt-tag">${L("Optional", "اختياري")}</span>` : ""}${q.hint ? `<span class="q-hint" style="display:block">${esc(L(q.hint, UI_AR[q.hint]))}</span>` : ""}</${tag}></span>`;
    }

    function matrixBody(q, a, c) {
      let h = `<div class="mx">
    <div class="mx-legend-m">${satLegend()}</div>`;
      for (const it of itemsOf(q, c)) {
        h += `<div class="m-row" data-item="${esc(it.id)}" role="radiogroup" aria-label="${esc(qText(it, c))}">
      <div class="m-label"><span class="q-num">${esc(it.id)}</span>${esc(qText(it, c))}</div>
      <div class="m-controls">${scaleHtml(it.id, 1, 5, a[it.id])}
        ${q.na ? `<label class="na"><input type="radio" name="${it.id}" value="N/A" ${a[it.id] === "N/A" ? "checked" : ""}><span class="box">${L("N/A", "لا ينطبق")}</span></label>` : ""}
      </div></div>`;
      }
      return h + "</div>";
    }

    /* ---- live progress for the CURRENT section: one unit per required answer (each matrix item counts) ---- */
    const progressEl = document.getElementById("progress");
    let lastPct = -1;
    function computeProgress() {
      const s = STEPS[cur];
      if (!s || s.kind !== "q") return 0;
      const a = bucket(s);
      let total = 0, done = 0;
      for (const id of s.qs) {
        const q = Q[id];
        if (q.optional || (q.showIf && !q.showIf(a))) continue;
        if (q.type === "matrix") {
          for (const it of itemsOf(q, s.community)) { total++; if (a[it.id] !== undefined) done++; }
        } else {
          total++;
          const v = a[id];
          if (Array.isArray(v) ? v.length : (v !== undefined && v !== "")) done++;
        }
      }
      return total ? Math.round(done / total * 100) : 0;
    }
    function updateProgress(force) {
      const pct = force !== undefined ? force : computeProgress();
      bar.style.width = pct + "%";
      progressEl.setAttribute("aria-valuenow", pct);
      const p = document.getElementById("pct");
      if (p) p.textContent = pct + "%";
      if (pct > lastPct && lastPct >= 0) {
        progressEl.classList.add("pulse");
        clearTimeout(updateProgress.t);
        updateProgress.t = setTimeout(() => progressEl.classList.remove("pulse"), 700);
      }
      lastPct = pct;
    }
    function setProgress(i) {
      const total = STEPS.length - 1;
      stepCount.innerHTML = i === 0 ? "" : `<span title="${L(`Step ${i} of ${total}`, `الخطوة ${i} من ${total}`)}">${i} / ${total}</span><span class="pct" id="pct" title="${L("Answered in this section", "تمت الإجابة في هذا القسم")}"></span>`;
      // new section: jump to its current fill without animating backwards, then animate per answer
      bar.style.transition = "none";
      lastPct = -1;
      updateProgress();
      void bar.offsetWidth;
      bar.style.transition = "";
    }

    /* All text arrives in the active language. */
    function heroHtml({ eyebrow, title, unitKey, unitVal, unitOf, num }) {
      return `<div class="fade-in">
      ${eyebrow ? `<p class="eyebrow">${esc(eyebrow)}</p>` : ""}
      <h1>${esc(title)}</h1>
      ${unitVal ? `<div class="hero-unit"><span class="k">${esc(unitKey)}</span><b><bdi>${esc(unitVal)}</bdi></b>${unitOf ? `<span class="of">${esc(unitOf)}</span>` : ""}</div>` : ""}
    </div>
    ${num ? `<div class="hero-num" aria-hidden="true">${num}</div>` : ""}`;
    }

    /* Sticky context bar: once the hero scrolls away, the header keeps showing the section
       and, for per-unit and per-community steps, which unit or community is being answered. */
    const ctxBar = document.getElementById("ctxBar");
    function setContext(step) {
      if (!step || step.kind !== "q") { ctxBar.innerHTML = ""; ctxBar.hidden = true; return; }
      let who = "";
      if (step.scope === "unit") {
        const of = step.count > 1 ? `<span class="ctx-of">${step.pos}/${step.count}</span>` : "";
        who = `<span class="ctx-who"><span class="ctx-k">${L("Unit", "الوحدة")}</span><b><bdi>${esc(unitLabel(UNITS[step.unit]))}</bdi></b>${of}</span>`;
      } else if (step.scope === "community") {
        who = `<span class="ctx-who"><span class="ctx-k">${L("Community", "المجتمع")}</span><b>${esc(commName(step.community))}</b><span class="ctx-of">${esc(step.sub.replace("Page ", "").replace(" of ", "/"))}</span></span>`;
      }
      ctxBar.innerHTML = `<div class="ctx-inner"><span class="ctx-part">${esc(L(step.part, PART_AR[step.part]))}</span>${who}</div>`;
      ctxBar.classList.toggle("has-who", !!who);
      ctxBar.hidden = false;
    }
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(([e]) => document.body.classList.toggle("hero-out", !e.isIntersecting),
        { rootMargin: "-80px 0px 0px 0px" }).observe(document.getElementById("hero"));
    } else {
      document.body.classList.add("hero-out");
    }

    function render(i, focusTop = true) {
      cur = i;
      const step = STEPS[i];
      setTheme(step.theme);
      setProgress(i);
      document.body.classList.toggle("co-brand", step.kind === "intro");
      document.body.classList.toggle("is-intro", step.kind === "intro");
      if (step.kind === "intro") return renderIntro();
      redraw = () => { readStep(step); render(cur, false); };

      let unitKey = "", unitVal = "", unitOf = "";
      if (step.scope === "unit") {
        unitKey = L("Unit", "الوحدة"); unitVal = unitLabel(UNITS[step.unit]);
        if (step.count > 1) unitOf = L(`${step.pos} of ${step.count}`, `${step.pos} من ${step.count}`);
      } else if (step.scope === "community") {
        unitKey = L("Community", "المجتمع"); unitVal = commName(step.community); unitOf = L(step.sub, step.subAr);
      }
      hero.innerHTML = heroHtml({
        eyebrow: L(step.part, PART_AR[step.part]), title: L(step.title, step.titleAr), unitKey, unitVal, unitOf, num: pad(i)
      });
      setContext(step);

      const last = i === STEPS.length - 1;
      const secEnd = !last && sectionAt(i).to === i;
      app.innerHTML = `<div class="fade-in">
    ${step.note ? `<p class="section-note">${bi(step.note, step.noteAr || UI_AR[step.note])}</p>` : ""}
    <form id="stepForm" novalidate>
      ${step.qs.map(id => renderQuestion(id, step)).join("")}
      <div class="nav">
        <button type="button" class="btn ghost" id="backBtn">${btnLabel("Back", "رجوع")}</button>
        <button type="submit" class="btn" id="nextBtn">${last ? btnLabel("Submit answers", "إرسال الإجابات")
          : secEnd ? btnLabel("Submit section", "إرسال القسم")
          : btnLabel("Continue", "متابعة") + '<span class="arrow" aria-hidden="true">→</span>'}</button>
      </div>
    </form></div>`;

      const form = document.getElementById("stepForm");
      form.addEventListener("change", e => onChange(step, e));
      form.addEventListener("change", () => updateProgress());
      form.addEventListener("submit", e => { e.preventDefault(); next(); });
      document.getElementById("backBtn").addEventListener("click", () => { readStep(step); render(cur - 1); });
      if (focusTop) { window.scrollTo({ top: 0 }); app.focus({ preventScroll: true }); }
    }

    /* Shown after a section's answers have been sent: the sections so far, what comes next,
       and the choice to continue or finish here. */
    function renderCheckpoint(sec) {
      const idx = SECTIONS.indexOf(sec);
      const upNext = SECTIONS[idx + 1];
      redraw = () => renderCheckpoint(sec);
      document.body.classList.remove("is-intro");
      setContext(null);
      updateProgress(100);
      hero.innerHTML = heroHtml({
        eyebrow: L(`Section ${idx + 1} of ${SECTIONS.length} saved`, `تم حفظ القسم ${idx + 1} من ${SECTIONS.length}`),
        title: L("Section complete", "اكتمل هذا القسم")
      });
      const rows = SECTIONS.map(s => {
        const state = sent.has(s.id) ? "done" : s === upNext ? "next" : "todo";
        const m = secMinutes(s);
        const note = isAr()
          ? (state === "done" ? "تم الحفظ" : state === "next" ? `التالي · ${minsAr(m)}` : minsAr(m))
          : (state === "done" ? "Saved" : state === "next" ? `Up next · about ${m} min` : `About ${m} min`);
        const who = secWho(s);
        return `<li class="sec is-${state}"${state === "next" ? ' aria-current="step"' : ""}>
        <span class="sec-dot" aria-hidden="true"></span>
        <span class="sec-en"><b>${esc(L(secName(s), secNameAr(s)))}</b><small>${esc(note)}${who ? ` · <bdi>${esc(who)}</bdi>` : ""}</small></span>
      </li>`;
      }).join("");
      app.innerHTML = `<div class="panel checkpoint fade-in">
    <div class="state-icon ok"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <p class="lead" role="status">${L(`Thank you. Your answers for ${esc(secName(sec))} have reached us.`, `شكرًا لك. وصلتنا إجاباتك عن ${esc(secNameAr(sec))}.`)}</p>
    <p>${L("You can finish here, or continue with the next section. Either way, what you have answered so far is already saved.",
      "يمكنك الإنهاء هنا أو المتابعة إلى القسم التالي. في الحالتين، إجاباتك حتى الآن محفوظة لدينا.")}</p>
    <ol class="sec-list">${rows}</ol>
    <div class="nav">
      <button type="button" class="btn ghost" id="finishBtn">${btnLabel("Finish here", "إنهاء هنا")}</button>
      <button type="button" class="btn" id="continueBtn">${btnLabel("Continue", "متابعة")}<span class="arrow" aria-hidden="true">→</span></button>
    </div>
  </div>`;
      document.getElementById("continueBtn").addEventListener("click", () => render(sec.to + 1));
      document.getElementById("finishBtn").addEventListener("click", finishEarly);
      window.scrollTo({ top: 0 });
      app.focus({ preventScroll: true });
    }

    /* Intro copy approved by Abby Turner (29 Oct 2026). */
    const INTRO = {
      en: [
        "Thank you for being a valued member of the G Developments community.",
        "Your experience matters to us. We invite you to share your feedback on your journey with G Developments, from the services you receive and the progress of your property to your overall community experience.",
        "Your feedback will help us identify opportunities for improvement and continue delivering the quality of service you deserve.",
        "We value your voice. Thank you for helping us shape a better experience."
      ],
      ar: [
        "نشكرك على كونك جزءًا من مجتمع G Developments.",
        "تجربتك تهمنا، ويسعدنا أن تشاركنا رأيك في رحلتك معنا، بدءًا من الخدمات المقدمة لك ومراحل تقدم وحدتك، وصولًا إلى تجربتك الشاملة داخل مجتمعك.",
        "تساعدنا آراؤك وملاحظاتك على تحديد فرص التطوير والارتقاء بمستوى خدماتنا، لنواصل تقديم التجربة التي تستحقها.",
        "رأيك يهمنا، وشكرًا لمساهمتك في تطوير تجربتك معنا."
      ]
    };

    function renderIntro() {
      redraw = renderIntro;
      const handed = UNITS.some(u => u.stage === "handed");
      const mins = handed ? 8 : 4, n = UNITS.length, secs = SECTIONS.length;
      const name = CUSTOMER.name ? `<bdi>${esc(CUSTOMER.name)}</bdi>` : "";
      setContext(null);
      hero.innerHTML = heroHtml({ title: L("Customer Experience Survey 2026", "استبيان تجربة العملاء 2026") });
      const greeting = isAr() ? (name ? `عزيزي/عزيزتي ${name}،` : "عميلنا العزيز،") : (name ? `Dear ${name},` : "Dear customer,");
      const facts = isAr()
        ? [[mins, arCount(mins, "دقيقة تقريبًا", "دقيقتان تقريبًا", "دقائق تقريبًا", "دقيقة تقريبًا")],
          [n, arCount(n, "وحدة مشمولة", "وحدتان مشمولتان", "وحدات مشمولة", "وحدة مشمولة")],
          [secs, arCount(secs, "قسم للاستبيان", "قسمان للاستبيان", "أقسام للاستبيان", "قسمًا للاستبيان")]]
        : [[`${mins} min`, "Estimated time"],
          [n, n === 1 ? "Property included" : "Properties included"],
          [secs, secs === 1 ? "Survey section" : "Survey sections"]];
      app.innerHTML = `<div class="panel fade-in">
    <p class="greeting">${greeting}</p>
    <div class="intro-copy">${INTRO[LANG].map(t => `<p>${esc(t)}</p>`).join("")}</div>
    <div class="facts">${facts.map(([v, k]) => `<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("")}</div>
    <h2 class="next-title units-title">${L(n === 1 ? "Your property" : "Your properties", n === 1 ? "وحدتك" : "وحداتك")}</h2>
    <div class="units">${UNITS.map(u => `<div class="unit-card"><b><bdi>${esc(unitLabel(u))}</bdi></b><span class="pill ${u.stage}">${L(STAGE_LABEL[u.stage], STAGE_AR[u.stage])}</span></div>`).join("")}</div>
    <p class="muted">${L("Your answers are sent at the end of each section, so you can stop after any section or carry on.",
      "تُرسل إجاباتك في نهاية كل قسم، فيمكنك التوقف بعد أي قسم أو المتابعة.")}</p>
    <div class="nav" style="justify-content:flex-end"><button class="btn" id="startBtn" type="button">${btnLabel("Start survey", "ابدأ الاستبيان")}<span class="arrow" aria-hidden="true">→</span></button></div>
  </div>`;
      document.getElementById("startBtn").addEventListener("click", () => render(1));
    }

    function renderState(kind) {
      redraw = () => renderState(kind);
      setTheme("gd");
      document.body.classList.add("co-brand");
      document.body.classList.remove("is-intro");
      stepCount.textContent = "";
      if (kind === "success") updateProgress(100);
      const titles = { success: "Thank you", error: "We couldn't send your answers", invalid: "This survey link isn't valid" };
      const titlesAr = { success: "شكرًا لك", error: "تعذر إرسال إجاباتك", invalid: "رابط الاستبيان غير صالح" };
      setContext(null);
      hero.innerHTML = heroHtml({
        eyebrow: L("Customer Experience Survey 2026", "استبيان تجربة العملاء 2026"), title: L(titles[kind], titlesAr[kind])
      });
      const icons = {
        ok: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
        err: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 16.5v.5"/></svg>`
      };
      if (kind === "success" && !REF) payload(); // assigns the reference when previewing
      const count = answeredCount();
      const comms = Object.keys(answers.communities).length;
      const doneN = SECTIONS.filter(s => sent.has(s.id)).length;
      /* The contact line only appears once A8 has been answered (an early finish can skip it). */
      const nextSteps = [
        L("Each team reviews the answers for its own area: your account, your unit and your community.",
          "يراجع كل فريق الإجابات الخاصة بمجاله: حسابك ووحدتك ومجتمعك."),
        answers.customer.A8 === "Yes" ? L("You agreed to be contacted, so if anything needs attention a member of our team will reach out within 48 hours.",
          "وافقت على التواصل معك، لذلك إذا احتاج أي أمر إلى متابعة سيتواصل معك أحد أعضاء فريقنا خلال 48 ساعة.")
          : answers.customer.A8 === "No" ? L("You chose not to be contacted, so we won't follow up with you directly about these answers.",
            "اخترت عدم التواصل معك، لذلك لن نتواصل معك مباشرةً بخصوص هذه الإجابات.") : "",
        L("If you need to reach us in the meantime, quote your reference so we can find your answers.",
          "إذا احتجت إلى التواصل معنا في هذه الأثناء، اذكر رقمك المرجعي حتى نتمكن من الوصول إلى إجاباتك.")
      ].filter(Boolean);
      const nUnits = UNITS ? UNITS.length : 0;
      const unitsLabel = isAr()
        ? arCount(nUnits, "وحدة", "وحدتان", "وحدات", "وحدة") + (comms ? ` · ${comms} ${arCount(comms, "مجتمع", "مجتمعان", "مجتمعات", "مجتمعًا")}` : "")
        : (nUnits === 1 ? "unit" : "units") + (comms ? ` · ${comms} ${comms === 1 ? "community" : "communities"}` : "");
      const views = {
        success: `<div class="state-icon ok">${icons.ok}</div>
      <p class="lead">${endedEarly
          ? L(`Thank you for your time. Your answers for ${doneN} of ${SECTIONS.length} sections have been received. They go directly to the teams responsible for each part of your experience.`,
            `شكرًا لوقتك. وصلتنا إجاباتك عن ${doneN} من ${SECTIONS.length} أقسام، وستصل مباشرةً إلى الفرق المسؤولة عن كل جزء من تجربتك.`)
          : L("Your answers have been received. They go directly to the teams responsible for each part of your experience.",
            "تم استلام إجاباتك، وستصل مباشرةً إلى الفرق المسؤولة عن كل جزء من تجربتك. شكرًا لوقتك.")}</p>
      <div class="facts">
        <div><b>${count || "—"}</b>${L("answers recorded", "الإجابات المسجلة")}</div>
        <div><b>${nUnits || "—"}</b>${unitsLabel}</div>
        <div><b class="ref"><bdi>${esc(REF || "—")}</bdi></b>${L("your reference", "رقمك المرجعي")}</div>
      </div>
      <h2 class="next-title">${L("What happens next", "الخطوات التالية")}</h2>
      <ol class="next-steps">${nextSteps.map((t, n) => `<li><span>${pad(n + 1)}</span>${t}</li>`).join("")}</ol>
      <p class="muted">${L("You can now close this page.", "يمكنك الآن إغلاق هذه الصفحة.")}</p>`,
        error: `<div class="state-icon err">${icons.err}</div>
      <p class="lead">${L("Something went wrong on our side. Your answers are still on this page, so nothing is lost.",
        "حدث خطأ من جانبنا. إجاباتك لا تزال محفوظة في هذه الصفحة، يرجى المحاولة مرة أخرى.")}</p>
      <div class="err-box">${L("Check your internet connection, then press <b>Try again</b>. If it keeps failing, keep this page open and try again in a few minutes.",
        "تحقق من اتصالك بالإنترنت، ثم اضغط <b>حاول مرة أخرى</b>. إذا استمرت المشكلة، اترك هذه الصفحة مفتوحة وحاول مرة أخرى بعد بضع دقائق.")}</div>
      <div class="nav" style="justify-content:flex-start"><button class="btn" id="retryBtn" type="button">${btnLabel("Try again", "حاول مرة أخرى")}</button>
      <button class="btn ghost" id="reviewBtn" type="button">${btnLabel("Review answers", "مراجعة الإجابات")}</button></div>`,
        invalid: `<div class="state-icon err">${icons.err}</div>
      <p>${L("The link may be incomplete or out of date. Please open the survey from the original email or WhatsApp message.",
        "قد يكون الرابط غير مكتمل أو منتهي الصلاحية. يرجى فتح الاستبيان من رسالة البريد الإلكتروني أو واتساب الأصلية.")}</p>`
      };
      app.innerHTML = `<div class="panel fade-in" role="${kind === "error" ? "alert" : "status"}">${views[kind]}</div>`;
      window.scrollTo({ top: 0 });
      if (kind === "error") {
        document.getElementById("retryBtn").addEventListener("click", submit);
        document.getElementById("reviewBtn").addEventListener("click", () => render(STEPS.length - 1));
      }
    }


    /* ===================== BOOT ===================== */
    if (LINK_ISSUES.length) console.warn("[CX survey] link issues", LINK_ISSUES);
    try {
      if (!UNITS) {
        renderState("invalid");
      } else {
        STEPS = buildSteps(UNITS);
        SECTIONS = buildSections(STEPS);
        const preview = params.get("state");
        // Preview: ?state=success | error | invalid shows that screen directly.
        // ?state=error without ?preview=1 is still handled in submit(): the survey runs and the send fails.
        if (preview === "success" || preview === "invalid" || (preview === "error" && params.get("preview") === "1")) renderState(preview);
        else render(0);
      }
    } catch (err) {
      /* Never leave a blank page: anything unexpected while building the survey shows the invalid-link screen. */
      console.error("[CX survey] could not start", err);
      try { renderState("invalid"); } catch (e) { document.body.innerHTML = "<p style='padding:24px;font-family:sans-serif'>This survey link isn't valid. · رابط الاستبيان غير صالح</p>"; }
    }

  </script>
</body>

</html>
